// ======================= parcours de formation =======================
const KIND = { cours: ["Cours", "📘"], schema: ["Schémas", "🎬"], questions: ["Questions EN", "🎧"], final: ["Avant l'examen", "🏁"], pratique: ["Entraînement", "🎯"] };
const stepKey = s => s.kind === "pratique" ? `pratique:${s.theme}` : s.id;
const isDone = s => !!(PROG.training || {})[stepKey(s)];
function markDone(key) { (PROG.training ||= {})[key] = Date.now(); save(); }
const stepLabel = s => `${KIND[s.kind][1]} ${KIND[s.kind][0]} · ${s.kind === "pratique" ? TH[s.theme].lib : shortTitle(s.title)}`;
const shortTitle = t => t.replace(/^(Principe|Épisode \d+)\s+—\s+/, "").replace(/,?\s+en schémas$/, "").replace(/\s+\(\d+ %\)$/, "");

// ordre recommandé : les domaines où il y a le plus à gagner d'abord (sinon l'ordre de l'examen)
function trainingDomains() {
  const pred = prediction();
  const doms = (TRAINING?.domains || []).map(d => ({ ...d, steps: d.steps.concat([{ kind: "pratique", theme: d.theme, title: `Entraînement · ${TH[d.theme].lib}`, duration: null }]) }));
  if (pred) {
    const gain = Object.fromEntries(pred.gains.map(g => [g.id, g.gain]));
    doms.sort((a, b) => (gain[b.theme] || 0) - (gain[a.theme] || 0));
  }
  return { doms, pred };
}
function nextStep() {
  const { doms } = trainingDomains();
  for (const d of doms) for (const s of d.steps) if (!isDone(s)) return { d, s };
  for (const s of TRAINING?.final || []) if (!isDone(s)) return { d: null, s };
  return null;
}
// l'étape qui suit celle-ci dans le parcours (la première pas encore faite après elle, sinon la toute suivante)
function stepAfter(cur) {
  const { doms } = trainingDomains();
  const all = doms.flatMap(d => d.steps).concat(TRAINING?.final || []);
  const i = all.findIndex(s => stepKey(s) === stepKey(cur));
  const after = all.slice(i + 1);
  return after.find(s => !isDone(s)) || after[0] || null;
}
const goStep = s => s && (s.kind === "pratique" ? practiceStep(s.theme) : playStep(s.id));
function trainingCount() {
  const { doms } = trainingDomains();
  const all = doms.flatMap(d => d.steps).concat(TRAINING?.final || []);
  return { done: all.filter(isDone).length, total: all.length };
}

function trainingView() {
  document.getElementById("homeBtn").hidden = false;
  const { doms, pred } = trainingDomains();
  const nx = nextStep(), cnt = trainingCount();
  const fmtMin = s => s ? `${Math.max(1, Math.round(s / 60))} min` : "";
  const stepRow = (s, i) => {
    const [kl, ic] = KIND[s.kind];
    const done = isDone(s), cur = nx && stepKey(nx.s) === stepKey(s);
    const action = s.kind === "pratique" ? `<button class="btn sm ${cur ? "primary" : ""}" data-practice="${s.theme}">🎯 S'entraîner (20 q.)</button>`
      : `<button class="btn sm ${cur ? "primary" : ""}" data-play-step="${esc(s.id)}">${s.video ? "▶ Regarder" : "▶ Écouter"}</button>`;
    return `<div class="tstep ${done ? "done" : ""} ${cur ? "cur" : ""}">
      <button class="tcheck" data-toggle="${esc(stepKey(s))}" title="${done ? "Marquer comme à faire" : "Marquer comme fait"}">${done ? "✓" : i + 1}</button>
      <div class="ttx"><span class="badge">${ic} ${kl}</span> <b>${esc(s.kind === "pratique" ? s.title : shortTitle(s.title))}</b> <span class="muted small">${fmtMin(s.duration)}</span></div>
      ${action}</div>`;
  };
  const blocks = doms.map((d, n) => {
    const ok = d.steps.filter(isDone).length, tot = d.steps.length;
    const g = pred?.gains.find(x => x.id === d.theme);
    const why = pred && n === 0 && g?.gain > 0 ? `<span class="badge warn">recommandé en premier · +${g.gain} pts possibles</span>` : "";
    return `<details class="tdom" ${nx?.d?.theme === d.theme ? "open" : ""}><summary>${dot(d.theme)}<b>${esc(TH[d.theme].lib)}</b>
        <span class="muted small">${TH[d.theme].w} % de l'examen</span> ${why}
        <span class="tprog"><span class="bar" style="width:120px"><span style="width:${pct(ok, tot)}%;background:var(${TH[d.theme].c})"></span></span> <span class="small muted">${ok}/${tot}</span></span></summary>
      <div class="tsteps">${d.steps.map(stepRow).join("")}</div></details>`;
  }).join("");
  const fin = TRAINING?.final || [];
  const finOk = fin.filter(isDone).length;
  $app.innerHTML = `<div class="card"><h2 style="margin-top:0">Parcours de formation</h2>
      <p class="muted small">Pour chaque domaine : le cours, puis les schémas du plus simple au plus complexe, les questions en anglais, et un entraînement ciblé.
      ${pred ? "Les domaines sont classés du plus rentable au moins rentable d'après tes résultats." : "Ordre de l'examen ; il s'adaptera à tes résultats après quelques sessions."}
      Une étape se coche toute seule quand la vidéo est vue à 90 % ou l'entraînement terminé.</p>
      <div class="row spread"><div class="row"><div class="bar" style="width:220px"><span style="width:${pct(cnt.done, cnt.total)}%;background:var(--accent)"></span></div>
        <span class="small">${cnt.done}/${cnt.total} étapes</span></div>
        ${nx ? `<button class="btn primary" id="tnext">Continuer : ${esc(stepLabel(nx.s))}</button>` : `<span class="badge ok">Parcours terminé 🎉</span>`}</div></div>
    <div style="margin-top:16px">${blocks}
      <details class="tdom" ${!nx?.d && nx ? "open" : ""}><summary>🏁 <b>Avant l'examen</b> <span class="muted small">technique, duels, quiz éclair</span>
        <span class="tprog"><span class="small muted">${finOk}/${fin.length}</span></span></summary>
        <div class="tsteps">${fin.map(stepRow).join("")}</div></details></div>`;
  $app.querySelectorAll("[data-play-step]").forEach(b => b.onclick = () => playStep(b.dataset.playStep));
  $app.querySelectorAll("[data-practice]").forEach(b => b.onclick = () => practiceStep(b.dataset.practice));
  $app.querySelectorAll("[data-toggle]").forEach(b => b.onclick = e => {
    e.preventDefault();
    const k = b.dataset.toggle; PROG.training ||= {};
    PROG.training[k] ? delete PROG.training[k] : PROG.training[k] = Date.now();
    save(); trainingView();
  });
  on("tnext", () => nx.s.kind === "pratique" ? practiceStep(nx.s.theme) : playStep(nx.s.id));
}

function findStep(id) {
  for (const d of TRAINING?.domains || []) for (const s of d.steps) if (s.id === id) return s;
  return (TRAINING?.final || []).find(s => s.id === id);
}
// lecteur plein écran ; l'étape est cochée à 90 % de visionnage
function playStep(id) {
  const s = findStep(id); if (!s) return;
  const nextS = stepAfter(s);
  let timer = null;
  const kind = s.video ? "video" : "audio", src = `/media/${kind}/${encodeURIComponent(s.id)}.${s.video ? "mp4" : "mp3"}`;
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="card" style="max-width:1000px" role="dialog" aria-modal="true">
      <div class="row spread" style="margin-bottom:10px"><b>${esc(shortTitle(s.title))}</b><button class="btn sm" data-close>Fermer</button></div>
      <${kind} controls autoplay style="width:100%;border-radius:10px;background:#000" src="${src}"></${kind}>
      <div class="row spread small muted" style="margin-top:8px"><span data-st>${isDone(s) ? "Déjà vu ✓" : "Cochée automatiquement à 90 %"}</span>
        <span class="row"><span data-auto></span>${nextS ? `<button class="btn sm" data-next title="${esc(stepLabel(nextS))}">Étape suivante →</button>` : ""}</span></div></div>`;
  document.body.appendChild(box);
  const m = box.querySelector(kind);
  const close = () => { clearInterval(timer); m.pause(); box.remove(); trainingView(); };
  const goNext = () => { close(); goStep(nextS); };
  // fin de la vidéo : l'étape suivante démarre toute seule après 5 s (annulable)
  m.addEventListener("ended", () => {
    if (!nextS) return;
    let n = 5;
    const auto = box.querySelector("[data-auto]");
    const paint = () => { auto.innerHTML = `Suivante dans ${n} s · <button class="btn sm" data-cancel>Rester ici</button>`;
      auto.querySelector("[data-cancel]").onclick = () => { clearInterval(timer); auto.textContent = ""; }; };
    paint();
    timer = setInterval(() => { if (--n <= 0) { clearInterval(timer); goNext(); } else paint(); }, 1000);
  });
  m.addEventListener("play", () => { clearInterval(timer); const a = box.querySelector("[data-auto]"); if (a) a.textContent = ""; });
  m.addEventListener("timeupdate", () => {
    if (!isDone(s) && m.duration && m.currentTime / m.duration >= 0.9) { markDone(stepKey(s)); box.querySelector("[data-st]").textContent = "Étape terminée ✓"; }
  });
  box.querySelector("[data-close]").onclick = close;
  box.querySelector("[data-next]")?.addEventListener("click", goNext);
  box.onkeydown = e => { if (e.key === "Escape") close(); };
}
// entraînement de fin de domaine : erreurs et questions jamais vues d'abord, puis le reste
function practiceStep(theme) {
  const P = pool().filter(q => q.theme === theme);
  if (!P.length) return alert("Aucune question de ce domaine dans la banque chargée.");
  const errs = shuffle(P.filter(q => PROG.questions[q.id]?.last === false));
  const fresh = shuffle(P.filter(q => !PROG.questions[q.id]?.seen));
  const rest = shuffle(P.filter(q => !errs.includes(q) && !fresh.includes(q)));
  start(`Parcours · ${TH[theme].lib}`, errs.concat(fresh, rest).slice(0, 20), "practice");
  S.trainingStep = `pratique:${theme}`;
}

// ======================= réinitialisation complète (avec confirmation) =======================
function resetDialog() {
  const nS = SESSIONS.length, nQ = Object.keys(PROG.questions || {}).length, nN = Object.keys(PROG.notes || {}).length;
  const nB = Object.keys(PROG.badClips || {}).length;
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="rt">
      <h2 id="rt" style="margin-top:0">Tout réinitialiser</h2>
      <p class="small muted">Une sauvegarde datée des fichiers actuels est faite avant d'effacer (fichiers <code>.backup-…json</code> à côté de ta banque). Tes réglages sont conservés.</p>
      <div class="grid" style="gap:8px">
        <label class="chk"><input type="checkbox" data-k="progress" checked> Scores, répétition espacée et parcours <span class="muted small">(${nQ} question(s) suivie(s))</span></label>
        <label class="chk"><input type="checkbox" data-k="sessions" checked> Historique des sessions <span class="muted small">(${nS} session(s))</span></label>
        <label class="chk"><input type="checkbox" data-k="notes" checked> Notes par question <span class="muted small">(${nN} note(s))</span></label>
        <label class="chk"><input type="checkbox" data-k="badClips" checked> Extraits masqués « pas pertinent » <span class="muted small">(${nB} question(s))</span></label>
      </div>
      <p style="margin:16px 0 6px">Pour confirmer, tape <b>RÉINITIALISER</b> :</p>
      <input id="rc" autocomplete="off" style="font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);width:100%">
      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="btn" id="rno">Annuler</button><button class="btn bad" id="ryes" disabled>Effacer définitivement</button></div>
    </div>`;
  document.body.appendChild(box);
  const input = box.querySelector("#rc"), yes = box.querySelector("#ryes");
  const close = () => box.remove();
  input.focus({ preventScroll: true });
  input.oninput = () => { yes.disabled = input.value.trim().toUpperCase() !== "RÉINITIALISER" || !box.querySelector("[data-k]:checked"); };
  box.querySelectorAll("[data-k]").forEach(c => c.onchange = input.oninput);
  box.querySelector("#rno").onclick = close;
  box.onclick = e => { if (e.target === box) close(); };
  box.onkeydown = e => { if (e.key === "Escape") close(); };
  yes.onclick = async () => {
    const what = { confirm: "RÉINITIALISER" };
    box.querySelectorAll("[data-k]").forEach(c => what[c.dataset.k] = c.checked);
    clearTimeout(saveT);                       // pas d'écriture en attente qui écraserait la remise à zéro
    yes.disabled = true; yes.textContent = "Effacement…";
    const r = await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(what) });
    if (!r.ok) { yes.textContent = "Échec"; return; }
    const { sauvegardes } = await r.json();
    close();
    await load();
    const msg = document.createElement("div");
    msg.className = "warnbox"; msg.style.marginBottom = "16px";
    msg.textContent = `Réinitialisation faite. Sauvegarde : ${sauvegardes.join(", ") || "aucun fichier à sauvegarder"}.`;
    $app.prepend(msg);
  };
}

// ======================= clavier =======================
document.addEventListener("keydown", e => {
  if (S && !S.saved && !document.querySelector(".modal") && !e.target.matches?.("input, select, textarea")) {
    if (S.pausedAt && (e.key === "Escape" || e.key === "Enter")) { e.preventDefault(); return resume(); }
    if (!S.pausedAt && e.key === "Escape" && document.getElementById("stem")) { e.preventDefault(); return pause(); }
  }
  if (!S || S.saved || !document.getElementById("stem") || e.target.matches?.("input, select, textarea")) return;
  const k = e.key.toUpperCase(), d = /^[A-F]$/.test(k) ? toOrig(S.i, k) : null;
  if (d && !S.reveal[S.i]) { e.preventDefault(); return e.shiftKey ? strike(d) : toggle(d); }
  if (S.mode === "exam") {
    if (e.key === "ArrowRight" && S.i < S.qs.length - 1) act("next");
    else if (e.key === "ArrowLeft" && S.i > 0) act("prev");
    else if (k === "M") act("flag");
    else if (k === "H") act("hesite");
    else if (k === "R" && !S.reveal[S.i]) act("solve");
    return;
  }
  const btn = sel => document.querySelector(`[data-act="${sel}"]:not(:disabled)`);
  if (e.key === "ArrowLeft" && S.i > 0) act("prev");
  else if (e.key === "ArrowRight" && btn("next")) act("next");
  else if (k === "P" && btn("skip")) act("skip");
  else if (k === "H" && btn("checkH")) act("checkH");
  else if (e.key === "Enter") { const b = btn("check") || btn("show") || btn("next"); if (b) { e.preventDefault(); b.click(); } }
});
document.getElementById("homeBtn").onclick = () => { if (!S || S.saved || S.mode !== "exam" || confirm("Abandonner l'examen en cours ?")) home(); };
// ======================= thème =======================
const THEME_LIB = { auto: ["🌓", "Thème : automatique (celui du système)"], light: ["☀️", "Thème : clair"], dark: ["🌙", "Thème : sombre"] };
function paintTheme() {
  const t = document.documentElement.dataset.theme || "auto", b = document.getElementById("themeBtn");
  b.textContent = THEME_LIB[t][0]; b.title = `${THEME_LIB[t][1]} — clic pour changer`;
}
document.getElementById("themeBtn").onclick = () => {
  const order = ["auto", "light", "dark"], cur = document.documentElement.dataset.theme || "auto";
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  try { next === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", next); } catch {}
  paintTheme();
};
paintTheme();
load().catch(err => { $app.innerHTML = `<div class="warnbox">Impossible de charger la banque : ${esc(err.message)}</div>`; });
</script>
</body>
</html>
